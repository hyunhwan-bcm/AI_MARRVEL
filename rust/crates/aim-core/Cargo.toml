[package]
name = "aim-core"
description = "Core computations of the AI-MARRVEL Rust port"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
flate2 = "1.1"
polars = { version = "0.55.2", default-features = false, features = ["csv", "lazy", "decompress", "dtype-full"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
# CPython's str hash (SipHash-2-4), for phrank's set iteration order; already a Polars dependency
siphasher = "1"
# arbitrary_precision keeps each JSON number's text so floats parse straight to f32 without
# going through f64 first.
serde_json = { version = "1", features = ["arbitrary_precision"] }
noodles-tabix = "0.67.0"
noodles-bgzf = "0.51.0"
noodles-csi = "0.61.0"
noodles-core = "0.20.0"
# Perl Storable reader, for the VEP cache's serialised chunks
chrysalis = "0.1.0"
# fastVEP (Apache-2.0): transcript model and consequence prediction, v0.4.0
fastvep-core = { git = "https://github.com/Huang-lab/fastVEP", tag = "v0.4.0" }
fastvep-genome = { git = "https://github.com/Huang-lab/fastVEP", tag = "v0.4.0" }
fastvep-consequence = { git = "https://github.com/Huang-lab/fastVEP", tag = "v0.4.0" }
